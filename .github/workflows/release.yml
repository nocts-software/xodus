name: "noct's Xodus Release Pipeline"

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      title:
        description: 'Release title'
        required: false
        default: "noct's xodus v1.0.0"
  repository_dispatch:
    types: [release-build, release, trigger-release, build-latest]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Release (Self-Hosted Runner)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Xodus Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Toolchain & Dependencies
        run: |
          echo "=== [1/4] Setting up Build Toolchains ==="
          export PATH="/opt/rust/cargo/bin:$HOME/.cargo/bin:$PATH"
          if ! command -v cargo &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable
          fi
          rustc --version
          cargo --version
          protoc --version 2>/dev/null || echo "protoc ready"

          # Ensure appimagetool is available
          if ! command -v appimagetool &>/dev/null; then
            echo "Installing appimagetool..."
            mkdir -p "$HOME/.local/bin"
            curl -L -o "$HOME/.local/bin/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" || true
            chmod +x "$HOME/.local/bin/appimagetool" 2>/dev/null || true
            export PATH="$HOME/.local/bin:$PATH"
          fi

      - name: Build XGameruntime Windows/Wine Runtime Libraries
        run: |
          echo "=== [2/4] Checking and Building XGameruntime Libraries ==="
          if [ ! -d "../xgameruntime" ]; then
            git clone --depth 1 https://github.com/nocts-software/xgameruntime.git ../xgameruntime 2>/dev/null || true
          fi
          if [ -d "../xgameruntime" ] && [ -f "../xgameruntime/build-xgameruntime.sh" ]; then
            (cd ../xgameruntime && ./build-xgameruntime.sh || true)
          fi

      - name: Build Xodus Workspace Binaries
        run: |
          echo "=== [3/4] Compiling Xodus Workspace with Cargo ==="
          export PATH="/opt/rust/cargo/bin:$HOME/.cargo/bin:$PATH"
          # Clean GUI cached binary to ensure updated UI assets are re-embedded
          rm -f target/release/xodus-gui target/release/deps/xodus_gui* target/release/deps/libxodus_gui* 2>/dev/null || true
          cargo build --release --workspace

      - name: Package Self-Contained AppImage
        run: |
          echo "=== [4/4] Packaging Self-Contained AppImage ==="
          export PATH="/opt/rust/cargo/bin:$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64

          mkdir -p dist/packages
          APPDIR="dist/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          # 1. Copy Compiled Rust Binaries
          cp target/release/xodus-cli "$APPDIR/usr/bin/xodus-cli"
          cp target/release/xodus-cli "$APPDIR/usr/bin/xodus"
          cp target/release/xodus-service "$APPDIR/usr/bin/xodus-service"
          if [ -f target/release/xodus-gui ]; then
            cp target/release/xodus-gui "$APPDIR/usr/bin/xodus-gui"
          fi

          # 2. Copy xgameruntime Wine Libraries
          if [ -f "../xgameruntime/xgameruntime.dll.so" ]; then
            cp -vf "../xgameruntime/xgameruntime.dll.so" "$APPDIR/usr/lib/"
            cp -vf "../xgameruntime/xgameruntime.dll" "$APPDIR/usr/lib/" 2>/dev/null || true
          fi
          if [ -f "../xgameruntime/twinapi.appcore.dll.so" ]; then
            cp -vf "../xgameruntime/twinapi.appcore.dll.so" "$APPDIR/usr/lib/"
            cp -vf "../xgameruntime/twinapi.appcore.dll" "$APPDIR/usr/lib/" 2>/dev/null || true
          fi
          if [ -f "../xgameruntime/api-ms-win-core-psm-appnotify-l1-1-0.dll.so" ]; then
            cp -vf "../xgameruntime/api-ms-win-core-psm-appnotify-l1-1-0.dll.so" "$APPDIR/usr/lib/"
            cp -vf "../xgameruntime/api-ms-win-core-psm-appnotify-l1-1-0.dll" "$APPDIR/usr/lib/" 2>/dev/null || true
          fi
          if [ -f "../xgameruntime/windows.ui.core.textinput.dll.so" ]; then
            cp -vf "../xgameruntime/windows.ui.core.textinput.dll.so" "$APPDIR/usr/lib/"
            cp -vf "../xgameruntime/windows.ui.core.textinput.dll" "$APPDIR/usr/lib/" 2>/dev/null || true
          fi
          if [ -f "../xgameruntime/wintypes.dll.so" ]; then
            cp -vf "../xgameruntime/wintypes.dll.so" "$APPDIR/usr/lib/"
            cp -vf "../xgameruntime/wintypes.dll" "$APPDIR/usr/lib/" 2>/dev/null || true
          fi
          if [ -d "../xgameruntime/x86_64-unix" ]; then
            mkdir -p "$APPDIR/usr/lib/x86_64-unix"
            cp -rf "../xgameruntime/x86_64-unix/"* "$APPDIR/usr/lib/x86_64-unix/" 2>/dev/null || true
          fi

          # 3. Create Desktop Integration & Icons
          if [ -f "crates/xodus-gui/xodus-gui.desktop" ]; then
            cp "crates/xodus-gui/xodus-gui.desktop" "$APPDIR/xodus-gui.desktop"
            cp "crates/xodus-gui/xodus-gui.desktop" "$APPDIR/xodus.desktop"
            cp "crates/xodus-gui/xodus-gui.desktop" "$APPDIR/usr/share/applications/xodus-gui.desktop"
          else
            printf "[Desktop Entry]\nType=Application\nName=noct's xodus\nComment=Xbox GDK compatibility runtime and manager for Linux\nExec=xodus\nIcon=xodus\nCategories=Game;Utility;\nTerminal=false\n" > "$APPDIR/xodus.desktop"
            cp "$APPDIR/xodus.desktop" "$APPDIR/usr/share/applications/xodus.desktop"
          fi

          if [ -f "crates/xodus-gui/xodus-gui.svg" ]; then
            cp "crates/xodus-gui/xodus-gui.svg" "$APPDIR/xodus-gui.svg"
            cp "crates/xodus-gui/xodus-gui.svg" "$APPDIR/xodus.svg"
            cp "crates/xodus-gui/xodus-gui.svg" "$APPDIR/usr/share/icons/hicolor/scalable/apps/xodus-gui.svg"
          fi

          if [ -f "assets/Icon/Icon512.png" ]; then
            cp "assets/Icon/Icon512.png" "$APPDIR/xodus.png"
            cp "assets/Icon/Icon512.png" "$APPDIR/usr/share/icons/hicolor/512x512/apps/xodus.png"
          fi

          # 4. Create AppRun Dispatcher
          cat << 'EOF' > "$APPDIR/AppRun"
#!/usr/bin/env bash
HERE="$(dirname "$(readlink -f "${0}")")"
export PATH="${HERE}/usr/bin:${PATH}"
export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
export XODUS_RUNTIME_PATH="${HERE}/usr/lib"
export WINEDLLPATH="${HERE}/usr/lib:${WINEDLLPATH}"

# Ensure WebKitGTK and GDK run reliably across all Wayland compositors (Bazzite, Fedora, SteamOS, GNOME, KDE)
export WEBKIT_DISABLE_DMABUF_RENDERER=1
export WEBKIT_DISABLE_COMPOSITING_MODE=1

# If invoked without arguments, or explicitly with gui / --gui / -g / ui, launch graphical interface
if [ -z "$1" ] || [ "$1" = "gui" ] || [ "$1" = "--gui" ] || [ "$1" = "-g" ] || [ "$1" = "ui" ]; then
    if [ "$1" = "gui" ] || [ "$1" = "--gui" ] || [ "$1" = "-g" ] || [ "$1" = "ui" ]; then shift; fi
    exec "${HERE}/usr/bin/xodus-gui" "$@"
fi

# If invoked as service/daemon
if [ "$1" = "service" ] || [ "$1" = "daemon" ]; then
    shift
    exec "${HERE}/usr/bin/xodus-service" "$@"
fi

# Otherwise route all CLI arguments and subcommands (login, download, play, run, status, etc.) to xodus CLI
if [ "$1" = "cli" ]; then shift; fi
exec "${HERE}/usr/bin/xodus" "$@"
EOF
          chmod +x "$APPDIR/AppRun"
          chmod +x "$APPDIR/usr/bin"/*

          # 5. Build Single Self-Contained AppImage
          appimagetool "$APPDIR" "dist/packages/nocts-xodus-gui.AppImage"

          echo "AppImage packaging complete (Single AppImage):"
          ls -lh dist/packages/

      - name: Publish GitHub Release
        env:
          AUTH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Publishing Release to GitHub ==="
          TAG_NAME="${{ github.event.inputs.tag || github.event.release.tag_name || github.event.client_payload.version || github.ref_name || 'v1.0.0' }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          TITLE="${{ github.event.inputs.title || github.event.release.name || github.event.client_payload.title || '' }}"
          if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
            TITLE="noct's xodus ${TAG_NAME}"
          fi
          
          # 1. Delete stale release object if present to completely reset release creation timestamp
          if command -v gh &>/dev/null; then
            gh release delete "${TAG_NAME}" -y --cleanup-tag=false --repo "${{ github.repository }}" 2>/dev/null || true
          fi
          
          OLD_RELEASE_ID=$(curl -s -H "Authorization: token ${AUTH_TOKEN}" https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME} | jq -r '.id // empty')
          if [ -n "$OLD_RELEASE_ID" ] && [ "$OLD_RELEASE_ID" != "null" ]; then
            echo "Removing stale release $OLD_RELEASE_ID via REST API..."
            curl -s -X DELETE -H "Authorization: token ${AUTH_TOKEN}" https://api.github.com/repos/${{ github.repository }}/releases/${OLD_RELEASE_ID}
          fi

          # 2. Create fresh release pointing to HEAD commit and upload strictly the single AppImage package
          if command -v gh &>/dev/null; then
            gh release create "${TAG_NAME}" "dist/packages/nocts-xodus-gui.AppImage" \
              --title "${TITLE}" \
              --notes "Latest release of noct's xodus (${TAG_NAME}) - Xbox GDK compatibility runtime and manager for Linux." \
              --repo "${{ github.repository }}" --latest
          else
            CREATE_RES=$(curl -s -X POST \
              -H "Authorization: token ${AUTH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases \
              -d "{\"tag_name\":\"${TAG_NAME}\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"${TITLE}\",\"body\":\"Latest release of noct's xodus (${TAG_NAME}) - Xbox GDK compatibility runtime and manager for Linux.\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"true\"}")
            
            RELEASE_ID=$(echo "$CREATE_RES" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              RELEASE_ID=$(curl -s -H "Authorization: token ${AUTH_TOKEN}" https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME} | jq -r '.id // empty')
            fi
            echo "GitHub Release ID: $RELEASE_ID"

            if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
              # Purge any old/stale assets
              ALL_ASSETS=$(curl -s -H "Authorization: token ${AUTH_TOKEN}" https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets | jq -r '.[].id // empty')
              for aid in $ALL_ASSETS; do
                if [ -n "$aid" ] && [ "$aid" != "null" ]; then
                  curl -s -X DELETE -H "Authorization: token ${AUTH_TOKEN}" https://api.github.com/repos/${{ github.repository }}/releases/assets/${aid}
                fi
              done

              echo "Uploading strictly one asset: nocts-xodus-gui.AppImage to release $RELEASE_ID..."
              curl -s -X POST \
                -H "Authorization: token ${AUTH_TOKEN}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"dist/packages/nocts-xodus-gui.AppImage" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=nocts-xodus-gui.AppImage"
            fi
          fi

      - name: Dispatch Catalog Update to Central Releases Repo
        if: always()
        env:
          PAT: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Dispatching Catalog Update to Central Hub ==="
          curl -s -X POST \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nocts-software/releases/dispatches \
            -d '{"event_type": "update-catalog", "client_payload": {"app": "xodus"}}' || true
